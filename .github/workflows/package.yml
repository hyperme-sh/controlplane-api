name: Standalone package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    environment: controlplane-libs-read
    steps:
      - name: Prepare test evidence directory
        run: echo "TEST_EVIDENCE_DIR=$RUNNER_TEMP/package-test-results" >> "$GITHUB_ENV"
      - name: Mint repository-scoped dependency token
        id: dependency-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CONTROLPLANE_LIBS_APP_ID }}
          private-key: ${{ secrets.CONTROLPLANE_LIBS_APP_PRIVATE_KEY }}
          owner: hyperme-sh
          permission-contents: read
          repositories: |
            controlplane-events
            controlplane-identity
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate source tests
        env:
          DEPENDENCY_READ_TOKEN: ${{ steps.dependency-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPENDENCY_READ_TOKEN" || { echo 'Private dependency read access is required'; exit 1; }
          header=$(printf 'x-access-token:%s' "$DEPENDENCY_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/hyperme-sh/controlplane-identity.git.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_1=http.https://github.com/hyperme-sh/controlplane-events.git.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $header"
          unset DEPENDENCY_READ_TOKEN
          uv lock --check
          uv sync --frozen
          uv run --frozen pytest
  package:
    needs: [source]
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    environment: controlplane-libs-read
    steps:
      - name: Prepare test evidence directory
        run: echo "TEST_EVIDENCE_DIR=$RUNNER_TEMP/package-test-results" >> "$GITHUB_ENV"
      - name: Mint repository-scoped dependency token
        id: dependency-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CONTROLPLANE_LIBS_APP_ID }}
          private-key: ${{ secrets.CONTROLPLANE_LIBS_APP_PRIVATE_KEY }}
          owner: hyperme-sh
          permission-contents: read
          repositories: |
            controlplane-events
            controlplane-identity
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Build candidate before executing package checks
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir=$(mktemp -d "$RUNNER_TEMP/release-candidate.XXXXXX")
          echo "RELEASE_CANDIDATE_DIR=$candidate_dir" >> "$GITHUB_ENV"
          uv build --no-sources --out-dir "$candidate_dir"
      - name: Validate API package
        env:
          DEPENDENCY_READ_TOKEN: ${{ steps.dependency-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPENDENCY_READ_TOKEN" || { echo 'Private dependency read access is required'; exit 1; }
          header=$(printf 'x-access-token:%s' "$DEPENDENCY_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/hyperme-sh/controlplane-identity.git.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_1=http.https://github.com/hyperme-sh/controlplane-events.git.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $header"
          unset DEPENDENCY_READ_TOKEN
          # Keep expected digests in this shell, not a test-writable manifest.
          candidate_hashes=$(cd "$RELEASE_CANDIDATE_DIR" && sha256sum -- *.whl *.tar.gz)
          bash scripts/check-package.sh
          (cd "$RELEASE_CANDIDATE_DIR" && sha256sum --check <<< "$candidate_hashes")
      - name: Retain matching package test inventories
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: package-test-results
          path: ${{ runner.temp }}/package-test-results/*
          if-no-files-found: error
          retention-days: 90
