name: GHCR consumer image preparation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify library and prepare consumer image
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/api-container.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          bash scripts/anonymous-command.sh env QUALIFIED_DIST_DIR="$scratch/dist" bash scripts/check-package.sh --fixtures
          QUALIFIED_DIST_DIR="$scratch/dist" bash scripts/check-container.sh
