[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-api"
version = "0.23.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Shared configuration and HTTP API scaffolding"
dependencies = [
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b", "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@8f16587d105f7352891a1d9d77ec8305bbf5cd29", "colorlog>=6.9.0", "fastapi>=0.135.0",
    "pydantic>=2.12.0", "pydantic-settings>=2.6.0", "email-validator>=2.0.0",
    "python-dotenv>=1.1.1", "prometheus-client>=0.21.1",
    "sqlalchemy>=2.0.43", "psycopg[binary]>=3.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_api"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["LICENSE", "/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[dependency-groups]
dev = ["pytest>=8.4.0", "httpx>=0.28.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
